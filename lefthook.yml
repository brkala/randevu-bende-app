# Lefthook Configuration for Randevu Bende
# Enforces Biome (lint/format) and TypeScript (type-check) at commit time.

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files} && git add {staged_files}
    type-check:
      run: pnpm type-check
fix-ai:
  parallel: false
  commands:
    01-lint-format:
      files: git ls-files --modified --others --exclude-standard
      glob: "*.{js,ts,jsx,tsx,css}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {files}
    02-type-check:
      files: git ls-files --modified --others --exclude-standard
      glob: "*.{ts,tsx}"
      run: pnpm type-check

e2e:
  parallel: false
  commands:
    01-db-reset:
      run: cross-env NODE_ENV=test prisma migrate reset --force
    02-db-seed:
      run: cross-env NODE_ENV=test prisma db seed
    03-storage-seed:
      run: cross-env NODE_ENV=test tsx src/features/storage/storage.seed.ts
    04-playwright:
      run: cross-env NODE_ENV=test playwright test
